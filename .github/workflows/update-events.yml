name: Update verified NA CS2 events and matches

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'style.css'
      - 'app.js'
      - 'data/**'
      - 'collectors/**'
      - 'tests/**'
      - '.github/workflows/update-events.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'

concurrency:
  group: na-cs2-pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r collectors/requirements.txt
      - name: Run collector tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate existing match data
        run: python collectors/validate.py
      - name: Validate existing event data
        run: python collectors/validate_events.py --allow-empty
      - name: Check frontend syntax
        run: node --check app.js
      - name: Test frontend rendering
        run: node tests/test_frontend.cjs

  collect:
    needs: verify
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      ready: ${{ steps.ready.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r collectors/requirements.txt

      - name: Refresh established event sources
        id: established
        continue-on-error: true
        run: python collectors/update_events.py
      - name: Discover additional Crossfire and NSTLGA events
        id: discovery
        continue-on-error: true
        run: python collectors/discover_events.py
      - name: Collect individual Crossfire and NSTLGA matches
        id: fixtures
        continue-on-error: true
        run: python collectors/update_matches.py

      - name: Validate event data before publication
        run: python collectors/validate_events.py
      - name: Validate match data before publication
        run: python collectors/validate.py
      - name: Commit validated data changes
        run: |
          git add data/events.json data/matches.json
          if git diff --cached --quiet; then
            echo 'No data changes'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Update verified NA CS2 event and match data'
            git push
          fi
      - name: Mark validated data ready
        id: ready
        run: echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Report collection results and source warnings
        if: always()
        env:
          ESTABLISHED_OUTCOME: ${{ steps.established.outcome }}
          DISCOVERY_OUTCOME: ${{ steps.discovery.outcome }}
          FIXTURES_OUTCOME: ${{ steps.fixtures.outcome }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          def count(path):
              p = Path(path)
              return len(json.loads(p.read_text(encoding='utf-8'))) if p.exists() else 'missing'

          events = count('data/events.json')
          matches = count('data/matches.json')
          print(f'Published data: {events} events, {matches} matches')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('### Data collection summary\n')
              summary.write(f'- Verified event records: **{events}**\n')
              summary.write(f'- Match records: **{matches}**\n')
              for name, key in [('Established event sources', 'ESTABLISHED_OUTCOME'),
                                ('New event discovery', 'DISCOVERY_OUTCOME'),
                                ('Individual match collection', 'FIXTURES_OUTCOME')]:
                  summary.write(f'- {name}: **{os.environ.get(key, "unknown")}**\n')
          if matches == 0:
              print('::warning::No verified individual matches were collected; review collector output and source availability.')
          for key in ('ESTABLISHED_OUTCOME', 'DISCOVERY_OUTCOME', 'FIXTURES_OUTCOME'):
              if os.environ.get(key) == 'failure':
                  print(f'::warning::{key} failed; independently validated records were retained.')
          PY

  deploy:
    needs: [verify, collect]
    if: always() && needs.verify.result == 'success' && (github.event_name == 'push' || needs.collect.outputs.ready == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Package static website with match and event data
        run: |
          mkdir -p _site/data
          cp index.html app.js style.css _site/
          cp data/matches.json data/sources.json data/events.json _site/data/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
